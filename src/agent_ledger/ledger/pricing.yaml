# Versioned pricing table (USD per 1k tokens). Source: ~/dev/standards/agentic-os/MODEL-PRICING.md,
# verified 2026-10-01 against https://platform.claude.com/docs/en/about-claude/pricing.
# Update whenever that file updates; do not let the two drift. Standard
# sticker rates only (no promotional/intro pricing) to avoid silent drift
# when a promo window expires.
#
# v3 (2026-08-02): `cache_read` and `cache_write` are optional per SKU. When
# omitted they are derived from `input` using Anthropic's published
# multipliers (0.1x read, 1.25x write) in ledger.pricing — so adding cache
# accounting did not require re-stating rates for every historical SKU. State
# them explicitly only for a SKU whose cache rates diverge from those ratios.
version: 3
skus:
  # cache_read diverges from the 0.1x default on the two newest SKUs
  # (Fable 5.1 = 0.025x, Opus 5.5 = 0.05x of input; cache writes stay 1.25x).
  claude-fable-5-1: { input: 0.010, output: 0.050, cache_read: 0.00025, vendor: anthropic }
  claude-fable-5: { input: 0.010, output: 0.050, vendor: anthropic }
  claude-opus-5-5: { input: 0.004, output: 0.020, cache_read: 0.0002, vendor: anthropic }
  claude-opus-5: { input: 0.005, output: 0.025, vendor: anthropic }
  claude-opus-4-8: { input: 0.005, output: 0.025, vendor: anthropic }
  claude-opus-4-7: { input: 0.005, output: 0.025, vendor: anthropic }
  claude-sonnet-5-5: { input: 0.002, output: 0.010, vendor: anthropic }
  # Sonnet 5 $2/$10 became the standard price (the planned 2026-09-01 rise to
  # $3/$15 was cancelled); rows before 2026-10-01 carried the wrong $3/$15.
  claude-sonnet-5: { input: 0.002, output: 0.010, vendor: anthropic }
  claude-sonnet-4-6: { input: 0.003, output: 0.015, vendor: anthropic }
  claude-haiku-4-5: { input: 0.001, output: 0.005, vendor: anthropic }
  claude-haiku-4-5-20251001: { input: 0.001, output: 0.005, vendor: anthropic }
  llama3.2:latest: { input: 0.0, output: 0.0, vendor: ollama }
  llama3.1:8b: { input: 0.0, output: 0.0, vendor: ollama }
  qwen2.5-coder:14b: { input: 0.0, output: 0.0, vendor: ollama }
  gpt-oss:20b: { input: 0.0, output: 0.0, vendor: ollama }
  gemma4:latest: { input: 0.0, output: 0.0, vendor: ollama }
  nomic-embed-text:latest: { input: 0.0, output: 0.0, vendor: ollama }
