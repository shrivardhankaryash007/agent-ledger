[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ledger"
version = "0.1.0"
description = "Local-first LLM cost and routing ledger."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yash Shrivardhankar" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "typer>=0.16,<1",
    "polars>=1.9,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.9,<3",
    "structlog>=25.4,<26",
    "pyyaml>=6,<7",
]

[project.scripts]
agent-ledger = "agent_ledger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ledger"]

[dependency-groups]
dev = [
    "hypothesis>=6.135,<7",
    "mypy>=1.16,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.11,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"src/agent_ledger/cli.py" = ["B008"]
"src/agent_ledger/ledger/models.py" = ["TC003"]
"src/agent_ledger/ledger/repository.py" = ["TC001", "TC003"]
"src/agent_ledger/ingest/claude_transcripts.py" = ["TC001", "TC003"]
"src/agent_ledger/report/spend.py" = ["TC002", "TC003"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--cov=agent_ledger",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
